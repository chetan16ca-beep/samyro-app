<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<link rel="manifest" href="manifest.json">
<title>SAMYRO</title>
<style>
:root{--n:#0f172a;--o:#f97316;--bg:#fff8ef;--m:#64748b;--l:#eadfce;--g:#16a34a}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--n)}
.app{max-width:540px;margin:auto;min-height:100vh}.top{position:sticky;top:0;z-index:10;background:white;border-bottom:1px solid var(--l);padding:14px 16px;display:flex;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:10px}.mark{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:var(--n);border:3px solid var(--o);color:var(--o);font-size:22px;font-weight:900}.brand b{font-size:24px}.sub{font-size:12px;color:var(--m)}
.wrap{padding:18px 16px 100px}.hero{padding:24px;border-radius:24px;background:linear-gradient(135deg,#17213c,#5d331c);color:#fff}.hero h1{font-size:36px;line-height:1.03;margin:10px 0}.ey{color:#fb923c;letter-spacing:3px;font-size:12px;font-weight:900}
.card,.order{background:white;border:1px solid var(--l);border-radius:22px;padding:18px;margin-top:16px}.row{display:flex;justify-content:space-between;align-items:center;gap:12px}
label{display:block;font-weight:750;margin:12px 0 6px}input,select{width:100%;padding:14px;border:1px solid #d9d3ca;border-radius:14px;font-size:16px;background:#fff}
.btn{border:0;border-radius:14px;padding:13px 15px;font-weight:850;font-size:15px}.orange{background:var(--o);color:var(--n)}.navy{background:var(--n);color:#fff}.ghost{background:#f1f5f9}.w{width:100%}
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(540px,100%);display:grid;grid-template-columns:repeat(4,1fr);background:#fff;border-top:1px solid var(--l);padding:8px 0 calc(8px + env(safe-area-inset-bottom));z-index:20}.nav button{border:0;background:transparent;padding:10px 4px;color:#64748b;font-weight:700}.nav .on{color:var(--o)}
.pill{padding:7px 10px;border-radius:999px;background:#ffedd5;font-size:12px;font-weight:850}.green{background:#dcfce7;color:#166534}.price{font-size:32px;font-weight:900}.otp{font-size:34px;letter-spacing:10px;font-weight:900}
.staff{min-height:100vh;background:linear-gradient(145deg,#111827,#111827 60%,#78350f);color:#fff;padding:24px}.role{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.1);border-radius:22px;padding:20px;margin-top:14px}
.kpi{display:grid;grid-template-columns:1fr 1fr;gap:12px}.k{background:#fff;border:1px solid var(--l);border-radius:18px;padding:16px}.k b{font-size:28px}
.note{margin-top:16px;padding:12px;border:1px dashed #fdba74;border-radius:14px;background:#fff7ed;color:#9a3412;font-size:13px}
.gpsrow{display:flex;gap:8px;align-items:center}.gpsrow input{flex:1}.gpsrow button{flex:0 0 auto}
</style>
</head>
<body><div id="root"></div>
<script>
const API="https://samyro-backend.chetan16ca.workers.dev/api";
let role="customer",view="book",riderPin="",adminPin="",currentRider=1;
const $=s=>document.querySelector(s), money=n=>"₹"+Math.round(Number(n||0));
async function api(path,opt={}){const r=await fetch(API+path,opt);const d=await r.json();if(!r.ok)throw new Error(d.error||"Request failed");return d}
function brand(extra=""){return `<div class=brand><div class=mark>S</div><div><b>SAMYRO</b><div class=sub>${extra}</div></div></div>`}
function top(extra=""){return `<div class=top>${brand(extra)}<button class="btn ghost" onclick="role='staff';render()">Staff</button></div>`}
function cnav(){return `<div class=nav><button class="${view==='book'?'on':''}" onclick="view='book';render()">Book</button><button class="${view==='track'?'on':''}" onclick="view='track';render()">Track</button><button class="${view==='orders'?'on':''}" onclick="view='orders';render()">Orders</button><button class="${view==='help'?'on':''}" onclick="view='help';render()">Help</button></div>`}
async function pricing(){try{return await api("/pricing")}catch(e){return {base_fare:30,base_km:2,per_km:9,urgent_surcharge:25,rider_payout_pct:78}}}
async function gps(){const f=$("#pu"),b=$("#gpsBtn");if(!navigator.geolocation)return alert("GPS unavailable");b.disabled=true;b.textContent="Locating…";navigator.geolocation.getCurrentPosition(p=>{f.value=`Current location (${p.coords.latitude.toFixed(6)}, ${p.coords.longitude.toFixed(6)})`;b.disabled=false;b.textContent="Use current location"},()=>{b.disabled=false;b.textContent="Use current location";alert("Location permission allow karein.")},{enableHighAccuracy:true,timeout:12000})}
async function customer(){
 if(view==="book"){const p=await pricing();return top("Customer")+`<div class=wrap><div class=hero><div class=ey>RIDE • SEND • DELIVER</div><h1>Anything, anywhere in the city.</h1><div>Shared booking • Server OTP • GPS pickup</div></div><div class=card><h2>Book delivery</h2><label>Name</label><input id=cn placeholder="Customer name"><label>Phone</label><input id=cp inputmode=tel placeholder="Mobile number"><label>Pickup</label><div class=gpsrow><input id=pu placeholder="Pickup address"><button id=gpsBtn class="btn navy" onclick="gps()">Use current location</button></div><label>Drop</label><input id=dr placeholder="Delivery address"><label>Distance (km)</label><input id=km type=number step=.1 value=5><label>Parcel</label><select id=pt><option>Parcel / Package</option><option>Documents</option><option>Medicine</option><option>Fragile item</option></select><label>Receiver name</label><input id=rn><label>Receiver phone</label><input id=rp inputmode=tel><label>Priority</label><select id=pr><option value=normal>Normal</option><option value=urgent>Urgent +${money(p.urgent_surcharge)}</option></select><label>Payment</label><select id=pay><option>UPI</option><option>CASH</option></select><button class="btn orange w" style="margin-top:14px" onclick="book()">Book Now</button></div><div class=note>Passenger Pick & Drop OFF until applicable permissions are confirmed.</div></div>${cnav()}`}
 if(view==="orders"){const os=await api("/orders");return top("Customer")+`<div class=wrap><h1>Orders</h1>${os.map(card).join("")||"<div class=card>No orders.</div>"}</div>${cnav()}`}
 if(view==="track"){const os=await api("/orders"),o=os.find(x=>!["delivered","cancelled"].includes(x.status))||os[0];return top("Customer")+`<div class=wrap><h1>Track</h1>${o?`<div class=card><div class=row><b style="font-size:24px">${o.code}</b><span class=pill>${o.status}</span></div><p>${o.pickup} → ${o.dropoff}</p><div class=card style="background:#f8fafc"><div class=sub>DELIVERY OTP</div><div class=otp>${o.otp}</div></div></div>`:"<div class=card>No order.</div>"}</div>${cnav()}`}
 return top("Customer")+`<div class=wrap><div class=card><h2>Help</h2><p>Support number/WhatsApp later connect kar sakte hain.</p></div></div>${cnav()}`
}
function card(o){return `<div class=order><div class=row><b>${o.code}</b><span class="pill ${o.status==='delivered'?'green':''}">${o.status}</span></div><p>${o.pickup} → ${o.dropoff}</p><div class=row><b>${money(o.fare)}</b><span>${o.payment}</span></div></div>`}
async function book(){try{if(!cn.value||!cp.value||!pu.value||!dr.value)return alert("Name, phone, pickup aur drop bhariye.");const b={customer_name:cn.value,customer_phone:cp.value,pickup:pu.value,dropoff:dr.value,distance_km:+km.value,parcel_type:pt.value,receiver_name:rn.value,receiver_phone:rp.value,priority:pr.value,payment:pay.value};const r=await api("/orders",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify(b)});alert(`Booked ${r.code} • Fare ${money(r.fare)} • OTP ${r.otp}`);view="track";render()}catch(e){alert(e.message)}}
function staff(){return `<div class=staff>${brand("RIDE • SEND • DELIVER")}<h1 style="font-size:48px;margin-top:70px">Staff access</h1><div class=role onclick="riderLogin()"><h2>Rider Login</h2><p>Jobs, status, OTP, earnings.</p></div><div class=role onclick="adminLogin()"><h2>Admin Login</h2><p>Bookings, riders, pricing, revenue.</p></div><div class=role onclick="role='customer';view='book';render()"><h2>← Customer App</h2></div></div>`}
function riderLogin(){const p=prompt("Enter Rider PIN");if(p!=="1234")return alert("Incorrect PIN");riderPin=p;role="rider";view="jobs";render()}
function adminLogin(){const p=prompt("Enter Admin PIN");if(p!=="5678")return alert("Incorrect PIN");adminPin=p;role="admin";render()}
function rnav(){return `<div class=nav><button class="${view==='jobs'?'on':''}" onclick="view='jobs';render()">Jobs</button><button class="${view==='active'?'on':''}" onclick="view='active';render()">Active</button><button class="${view==='earnings'?'on':''}" onclick="view='earnings';render()">Earnings</button><button class="${view==='profile'?'on':''}" onclick="view='profile';render()">Profile</button></div>`}
async function rider(){const os=await api("/orders"),es=await api("/earnings?rider_id="+currentRider),p=await pricing();
 if(view==="jobs"){const jobs=os.filter(o=>o.status==="placed");return top("Jignesh Rathod · Online")+`<div class=wrap><h1>Available jobs</h1>${jobs.map(o=>`<div class=order><div class=row><b>${o.code}</b><span>${money(Math.round(o.fare*p.rider_payout_pct/100))} payout</span></div><p>${o.pickup} → ${o.dropoff}</p><button class="btn orange w" onclick="act(${o.id},'accept')">Accept job</button></div>`).join("")||"<div class=card>No open jobs.</div>"}</div>${rnav()}`}
 if(view==="active"){const a=os.filter(o=>o.rider_id===currentRider&&!["delivered","cancelled"].includes(o.status));return top("Jignesh Rathod · Online")+`<div class=wrap><h1>Active deliveries</h1>${a.map(o=>`<div class=order><div class=row><b>${o.code}</b><span class=pill>${o.status}</span></div><p>${o.pickup} → ${o.dropoff}</p>${action(o)}</div>`).join("")||"<div class=card>Nothing active.</div>"}</div>${rnav()}`}
 if(view==="earnings"){const total=es.reduce((s,e)=>s+Number(e.amount||0),0);return top("Jignesh Rathod")+`<div class=wrap><h1>Earnings</h1><div class=hero><div class=ey>TOTAL PAYOUT</div><div class=price>${money(total)}</div><div>${es.length} completed jobs</div></div>${es.map(e=>`<div class=order><div class=row><b>${e.code}</b><b>${money(e.amount)}</b></div><div class=sub>${e.pickup} → ${e.dropoff}</div></div>`).join("")}</div>${rnav()}`}
 return top("Jignesh Rathod")+`<div class=wrap><div class=card><h2>Jignesh Rathod</h2><p>GJ-16 AB 4412 · Splendor</p><p>Ankleshwar · Online</p></div></div>${rnav()}`
}
function action(o){if(o.status==="accepted")return `<button class="btn orange w" onclick="act(${o.id},'picked_up')">Mark picked up</button>`;if(o.status==="picked_up")return `<button class="btn orange w" onclick="act(${o.id},'in_transit')">Start delivery</button>`;if(o.status==="in_transit")return `<input id="otp${o.id}" placeholder="Delivery OTP"><button class="btn orange w" style="margin-top:10px" onclick="deliver(${o.id})">Verify & deliver</button>`;return ""}
async function act(id,a){await api("/orders/"+id,{method:"PATCH",headers:{"content-type":"application/json","x-role":"rider","x-pin":riderPin},body:JSON.stringify({action:a,rider_id:currentRider})});view="active";render()}
async function deliver(id){try{await api("/orders/"+id,{method:"PATCH",headers:{"content-type":"application/json","x-role":"rider","x-pin":riderPin},body:JSON.stringify({action:"deliver",otp:$("#otp"+id).value})});view="earnings";render()}catch(e){alert(e.message)}}
async function admin(){const os=await api("/orders"),rs=await api("/riders"),p=await pricing(),active=os.filter(o=>["accepted","picked_up","in_transit"].includes(o.status)).length,rev=os.filter(o=>o.status==="delivered").reduce((s,o)=>s+Number(o.fare||0),0);return top("Admin")+`<div class=wrap><h1>Operations console</h1><div class=kpi><div class=k><div class=sub>Bookings</div><b>${os.length}</b></div><div class=k><div class=sub>Active</div><b>${active}</b></div><div class=k><div class=sub>Online riders</div><b>${rs.filter(r=>r.online).length}</b></div><div class=k><div class=sub>Revenue</div><b>${money(rev)}</b></div></div><div class=card><h2>Pricing</h2><label>Base fare</label><input id=bf type=number value="${p.base_fare}"><label>Per km</label><input id=pk type=number value="${p.per_km}"><label>Urgent surcharge</label><input id=us type=number value="${p.urgent_surcharge}"><label>Rider payout %</label><input id=pp type=number value="${p.rider_payout_pct}"><button class="btn orange w" style="margin-top:12px" onclick="saveP()">Save pricing</button></div><div class=card><h2>Bookings</h2>${os.map(card).join("")}</div></div>`}
async function saveP(){await api("/pricing",{method:"PATCH",headers:{"content-type":"application/json","x-role":"admin","x-pin":adminPin},body:JSON.stringify({base_fare:+bf.value,base_km:2,per_km:+pk.value,urgent_surcharge:+us.value,rider_payout_pct:+pp.value,passenger_ride_enabled:false})});alert("Pricing saved");render()}
async function render(){const r=$("#root");r.innerHTML='<div class=wrap><div class=card><h2>SAMYRO loading…</h2></div></div>';try{r.innerHTML=role==="customer"?await customer():role==="staff"?staff():role==="rider"?await rider():await admin()}catch(e){r.innerHTML=`<div class=wrap><div class=card><h2>Connection error</h2><p>${e.message}</p></div></div>`}}
render();
</script></body></html>
