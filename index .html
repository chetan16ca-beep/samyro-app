<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SAMYRO</title><style>*{box-sizing:border-box}body{margin:0;font-family:-apple-system,Arial;background:#fff8ef;color:#111827}.top{background:#111827;color:#fff;padding:28px 20px;border-radius:0 0 28px 28px}.brand{font-size:34px;font-weight:900}.tag{color:#fb923c;font-weight:800}.wrap{max-width:520px;margin:auto}.hero,.card{padding:20px}.hero h1{font-size:38px;line-height:1;margin:10px 0}.card{margin:14px 18px;background:#fff;border:1px solid #eadfce;border-radius:22px}label{display:block;font-weight:700;margin:12px 0 6px}input,select{width:100%;padding:14px;border:1px solid #ddd;border-radius:14px;font-size:16px}button{width:100%;padding:15px;margin-top:14px;border:0;border-radius:14px;background:#f47b20;font-weight:900;font-size:16px}.price{font-size:34px;font-weight:900}.muted{color:#667085}.notice{margin-top:14px;padding:12px;background:#fff1e6;border-radius:14px}</style></head><body><div class="wrap"><div class="top"><div class="brand">SAMYRO</div><div class="tag">RIDE • SEND • DELIVER</div></div><div class="hero"><div class="muted">LOCAL DELIVERY</div><h1>Anything, anywhere in the city.</h1><p>Fast local pickup & delivery.</p></div><div class="card"><h2>Book a delivery</h2><label>Name</label><input id="n" placeholder="Your name"><label>Phone</label><input id="p" placeholder="Mobile number"><label>Pickup</label><input id="pu" placeholder="Pickup address"><button onclick="gps()">📍 Use current location</button><label>Drop</label><input id="dr" placeholder="Delivery address"><label>Distance (km)</label><input id="km" type="number" value="5"><label>Priority</label><select id="pr"><option>Normal</option><option>Urgent</option></select><p class="muted">ESTIMATED FARE</p><div class="price" id="fare">₹75</div><button onclick="book()">Book Now</button><div class="notice">Passenger ride service disabled until applicable permissions are confirmed.</div></div><div class="card" id="st"><h2>Track order</h2><p class="muted">Latest booking will appear here.</p></div></div><script>const k=document.getElementById("km"),r=document.getElementById("pr"),f=document.getElementById("fare");function calc(){let d=Math.max(1,+k.value||1);f.textContent="₹"+Math.round(45+Math.max(0,d-2)*10+(r.value==="Urgent"?25:0))}k.oninput=calc;r.onchange=calc;calc();function gps(){navigator.geolocation?navigator.geolocation.getCurrentPosition(x=>pu.value="Current location: "+x.coords.latitude.toFixed(6)+", "+x.coords.longitude.toFixed(6),()=>alert("Location permission allow karein.")):alert("GPS unavailable")}function book(){if(!pu.value||!dr.value)return alert("Pickup aur drop bhariye.");let c="SM"+Math.floor(100000+Math.random()*900000),o=Math.floor(1000+Math.random()*9000);st.innerHTML="<h2>Booking confirmed</h2><p><b>"+c+"</b></p><p>"+pu.value+" → "+dr.value+"</p><p><b>Fare: "+f.textContent+"</b></p><p>Delivery OTP: <b>"+o+"</b></p><p class=muted>Demo version</p>";st.scrollIntoView({behavior:"smooth"})}</script></body></html>
